<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact - Praxis Learning Centre</title>
    <script
      src="https://kit.fontawesome.com/5da7f1b67b.js"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="./styles/styles.css" />
    <script
      src="https://code.jquery.com/jquery-3.7.1.min.js"
      integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <nav>
      <img src="./img/praxis-logo.png" alt="Praxis Logo" />
      <div class="navigation">
        <ul>
          <i id="menu-close" class="fa-solid fa-xmark"></i>
          <li><a href="./index.html">Home</a></li>
          <li><a href="./about.html">About</a></li>
          <li><a href="./articles.html">Articles</a></li>
          <li><a class="active" href="./contact.html">Contact</a></li>
        </ul>
        <i id="menu-btn" class="fa-solid fa-bars"></i>
      </div>
    </nav>
    <section id="contact-home">
      <h2>Contact Us</h2>
    </section>

    <section id="contact">
      <div class="getin">
        <h2>Get In Touch</h2>
        <p>For admission and other enquiries</p>
        <div class="getin-details">
          <h3>Office</h3>
          <div>
            <i class="fa-solid fa-house get"></i>
            <p>Somasagara, Karnataka 562111. India</p>
          </div>
          <h3>Phone</h3>
          <div>
            <i class="fa-solid fa-phone get"></i>
            <p>+91 9448386968</p>
          </div>

          <h3>Email</h3>
          <div>
            <i class="fa-solid fa-envelope get"></i>
            <p>alextuscano@gmail.com</p>
          </div>
        </div>
      </div>
      <div class="form">
        <h4>Let's Connect</h4>
        <p>For admission and other enquiries</p>
        <div class="form-row">
          <input type="text" placeholder="Your Name">
          <input type="email" name="email" id="email" placeholder="Your Email">
        </div>
        <div class="form-col">
          <input type="text" placeholder="Subject">
        </div>
        <div class="form-col">
          <textarea name="" id="" cols="30" rows="8" placeholder="Message"></textarea>
        </div>
        <div class="form-col">
          <button>Send Message</button>
        </div>
      </div>
    </section>
    <section id="map">
      <iframe
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3883.2581864310605!2d77.31517767484944!3d13.271799508225982!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3bb1d79bb2f05507%3A0x391b8a8ae68ff935!2sBlue%20Valley%20Praxis%20Centre%20of%20Learning!5e0!3m2!1sen!2suk!4v1696968614983!5m2!1sen!2suk"
        style="border:0;" allowfullscreen="" loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"></iframe>
    </section>
    <footer>
      <div class="copyright">
        <p>Copyright &copy;2024 Praxis Learning Centre</p>
      </div>
    </footer>
    <script>
      $("#menu-btn").click(function () {
        $("nav .navigation ul").addClass("active");
      });
      $("#menu-close").click(function () {
        $("nav .navigation ul").removeClass("active");
      });
    </script>
  </body>
</html>
